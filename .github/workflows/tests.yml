name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: habit_tracker
          POSTGRES_PASSWORD: habit_tracker_dev_pw
          POSTGRES_DB: habit_tracker_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U habit_tracker -d habit_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://habit_tracker:habit_tracker_dev_pw@localhost:5433/habit_tracker_test
          SECRET_KEY: test-secret-key
        run: pytest
